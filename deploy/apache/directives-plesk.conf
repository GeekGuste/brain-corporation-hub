# =============================================================================
# Directives Apache additionnelles, a coller dans Plesk
# -----------------------------------------------------------------------------
# Ou les coller, exactement :
#
#   Plesk > Sites web et domaines > <le domaine>
#         > Parametres Apache et nginx
#         > Directives Apache additionnelles
#         > la case « HTTPS », PAS la case « HTTP »
#
# Pourquoi la case HTTPS seulement : le vhost HTTP doit continuer de servir
# /.well-known/acme-challenge depuis le disque, sinon Let's Encrypt ne peut
# plus renouveler le certificat et il expire au bout de deux mois, en silence.
#
# Il y a DEUX blocs dans ce fichier. Coller le bloc A sur
# braincorporationhub.com, le bloc B sur dev.braincorporationhub.com. Jamais
# les deux sur le meme domaine : ils se contrediraient.
#
# Prerequis, une seule fois sur le serveur :
#   a2enmod proxy proxy_http headers && systemctl restart apache2
#
# -----------------------------------------------------------------------------
# AVANT TOUTE CHOSE : desactiver le traitement statique de nginx
# -----------------------------------------------------------------------------
# Plesk place nginx devant Apache. Si l'option « Traitement intelligent des
# fichiers statiques » est active, nginx essaie de servir lui-meme tout ce qui
# ressemble a un fichier statique, en le cherchant sur le disque du domaine.
#
# Or les fichiers JavaScript et CSS de l'application n'existent PAS sur le
# disque : ils sont servis par le conteneur. Le symptome est deroutant, parce
# que la page s'affiche : du HTML brut, sans aucun style, avec des 404 sur
# main-XXXX.js dans la console du navigateur.
#
# Dans Plesk, meme ecran que les directives ci-dessous :
#   - decocher « Traitement intelligent des fichiers statiques »
#   - decocher « Servir les fichiers statiques directement par nginx » si elle
#     est presente
# =============================================================================


# #############################################################################
# BLOC A : PRODUCTION, a coller sur braincorporationhub.com
# #############################################################################

# --- Transmettre le nom d'hote demande par le visiteur ----------------------
#
# INDISPENSABLE, et c'est le piege le plus couteux de cette configuration.
#
# Par defaut, Apache remplace l'en-tete Host par celui de la cible, donc
# « 127.0.0.1:3000 ». Or le serveur de rendu Angular n'accepte que les hotes
# listes dans SITE_ALLOWED_HOSTS (braincorporationhub.com et le www). Il
# rejetterait donc la requete, et la page arriverait VIDE : un <app-root> sans
# rien dedans, sans message d'erreur visible.
ProxyPreserveHost On

# --- Laisser le defi Let's Encrypt au disque --------------------------------
# La seule exclusion de ce fichier. Elle garantit le renouvellement du
# certificat meme si Plesk valide en HTTPS.
#
# NE PAS ajouter d'exclusion pour robots.txt ni sitemap.xml : Plesk depose
# souvent son propre robots.txt dans la racine du domaine, et il prendrait le
# pas sur le notre, qui est genere par le serveur Node d'apres la variable
# d'environnement (CLAUDE.md §12).
ProxyPass /.well-known/ !

# --- L'API .NET -------------------------------------------------------------
# Place AVANT la regle generale : Apache retient la premiere regle qui
# correspond, dans l'ordre de declaration.
#
# Noter les barres obliques finales des deux cotes. Elles comptent :
# l'application .NET expose ses routes a la RACINE (/sante/pret, et plus tard
# le webhook Stripe), elle n'a pas de prefixe /api. Cette regle enleve donc le
# /api au passage :
#
#   https://braincorporationhub.com/api/sante/pret
#     -> http://127.0.0.1:8080/sante/pret
ProxyPass        /api/ http://127.0.0.1:8080/
ProxyPassReverse /api/ http://127.0.0.1:8080/

# --- Le reste du site, rendu par le serveur Angular -------------------------
#
# La verification apres deploiement :
#   curl https://braincorporationhub.com/robots.txt
# doit renvoyer notre contenu, pas celui de Plesk.
ProxyPass        / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/

# --- En-tetes transmis ------------------------------------------------------
# Sans eux, l'application se croit en HTTP alors qu'Apache a termine le HTTPS.
# Cela casserait les URL generees et, plus tard, la verification de signature
# du webhook Stripe (CLAUDE.md §11).
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port  "443"

# --- En-tetes de securite ---------------------------------------------------
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
# HSTS : a n'activer qu'une fois le certificat confirme et le site reellement
# en ligne. Une erreur ici enferme le domaine pour la duree annoncee.
# Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"


# #############################################################################
# BLOC B : PREPROD, a coller sur dev.braincorporationhub.com
# -----------------------------------------------------------------------------
# Identique au bloc A, aux ports pres : 8082 et 3001.
#
# La protection par mot de passe se regle ailleurs dans Plesk :
#   Plesk > Sites web et domaines > dev.braincorporationhub.com
#         > Repertoires proteges par mot de passe
# C'est la seule protection etanche contre l'indexation (CLAUDE.md §12.1).
# L'en-tete X-Robots-Tag pose par le serveur Node vient par-dessus, en
# complement, pas en remplacement.
# #############################################################################

ProxyPreserveHost On

# --- Mot de passe, si l'ecran Plesk est indisponible ------------------------
#
# A n'utiliser QUE si « Repertoires proteges par mot de passe » est introuvable
# dans Plesk, ou si l'ajout d'utilisateur y echoue. Les deux mecanismes font la
# meme chose : n'en activez qu'un, sinon le visiteur doit s'authentifier deux
# fois.
#
# Preparer le fichier de mots de passe, une fois, en SSH sur le serveur :
#
#   apt-get install -y apache2-utils          # si htpasswd est absent
#   mkdir -p /etc/apache2/brainhub
#   htpasswd -c /etc/apache2/brainhub/preprod.htpasswd preprod
#   chown root:www-data /etc/apache2/brainhub/preprod.htpasswd
#   chmod 640 /etc/apache2/brainhub/preprod.htpasswd
#
# Puis decommenter les deux blocs ci-dessous.
#
# Pourquoi cela protege AUSSI le site proxifie : l'authentification Apache est
# evaluee avant le proxy, donc la requete n'atteint jamais le conteneur sans
# identifiants valables.
#
# Si Apache renvoie 500 apres activation, c'est qu'il ne peut pas lire le
# fichier : verifier le groupe du processus Apache, ou passer le fichier en
# chmod 644. Il ne contient qu'une empreinte, pas le mot de passe.
#
# <Location />
#   AuthType Basic
#   AuthName "Preproduction Brain Corporation Hub"
#   AuthUserFile /etc/apache2/brainhub/preprod.htpasswd
#   Require valid-user
# </Location>
#
# DEUX exceptions, placees APRES le bloc ci-dessus pour le neutraliser sur ces
# seuls chemins : Apache retient la section la plus specifique.
#
# La premiere pour le renouvellement du certificat.
#
# <Location /.well-known/>
#   Require all granted
# </Location>
#
# La seconde pour le WEBHOOK STRIPE, et elle est indispensable.
#
# Stripe appelle cette URL depuis ses serveurs et ne connait aucun mot de
# passe : derriere l'authentification, il recevrait 401 sur chaque evenement.
# Les paiements seraient encaisses, aucune inscription ne serait confirmee,
# aucun email ne partirait, et Stripe finirait par desactiver l'endpoint.
#
# L'ouvrir ne l'expose pas : le webhook verifie la signature de chaque requete
# et refuse tout ce qui n'est pas signe du secret de cet environnement
# (CLAUDE.md §9 et §15). C'est la signature qui protege, pas le mot de passe.
#
# <Location /api/webhooks/>
#   Require all granted
# </Location>
#
# L'URL a declarer dans Stripe est alors :
#   https://dev.braincorporationhub.com/api/webhooks/stripe   (preprod)
#   https://braincorporationhub.com/api/webhooks/stripe       (production)
# Chacune produit SON PROPRE secret de signature, et il y en a trois en tout
# avec celui du Stripe CLI en local.

ProxyPass /.well-known/ !

ProxyPass        /api/ http://127.0.0.1:8082/
ProxyPassReverse /api/ http://127.0.0.1:8082/

ProxyPass        / http://127.0.0.1:3001/
ProxyPassReverse / http://127.0.0.1:3001/

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port  "443"

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
