# =============================================================================
# Directives Apache additionnelles, a coller dans Plesk
# -----------------------------------------------------------------------------
# Plesk > Domaines > <domaine> > Parametres Apache et nginx
#   > Directives Apache additionnelles > HTTPS
#
# Deux versions ci-dessous : production et preprod. Elles ne different que par
# les ports. Kestrel et le processus Node ne sont jamais exposes directement
# (CLAUDE.md §11).
#
# Prerequis : les modules proxy et proxy_http actives.
#   a2enmod proxy proxy_http && systemctl restart apache2
# =============================================================================


# =============================================================================
# PRODUCTION : braincorporationhub.com
# =============================================================================

# --- L'API ------------------------------------------------------------------
# Place AVANT la regle generale : la premiere qui correspond gagne.
ProxyPass        /api  http://127.0.0.1:8080/api
ProxyPassReverse /api  http://127.0.0.1:8080/api

# --- Le reste du site, rendu par le serveur Angular -------------------------
#
# ATTENTION, le piege : aucune exclusion ici.
#
# Plesk depose souvent son propre robots.txt dans la racine du domaine. Si
# Apache le servait lui-meme, il ne transmettrait jamais la requete au
# conteneur, et robots.txt comme sitemap.xml seraient ceux de Plesk et non les
# notres. Or ces deux fichiers sont generes par le serveur Node a partir de la
# configuration de l'environnement (CLAUDE.md §12).
#
# La verification apres deploiement :
#   curl https://braincorporationhub.com/robots.txt
# doit renvoyer notre contenu, pas celui de Plesk.
ProxyPass        /  http://127.0.0.1:3000/
ProxyPassReverse /  http://127.0.0.1:3000/

# --- En-tetes transmis ------------------------------------------------------
# Sans eux, l'application se croit en HTTP alors qu'Apache a termine le HTTPS.
# Cela casserait les URL generees et, plus tard, la verification de signature
# du webhook Stripe (CLAUDE.md §11).
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port  "443"

# --- En-tetes de securite ---------------------------------------------------
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
# HSTS : a n'activer qu'une fois le certificat confirme et le site reellement
# en ligne. Une erreur ici enferme le domaine pour la duree annoncee.
# Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"


# =============================================================================
# PREPROD : dev.braincorporationhub.com
# -----------------------------------------------------------------------------
# Memes directives, ports 8082 et 3001.
#
# La protection par mot de passe se regle ailleurs dans Plesk :
#   Plesk > Domaines > dev... > Repertoires proteges par mot de passe
# C'est la seule protection etanche contre l'indexation (CLAUDE.md §12.1).
# L'en-tete X-Robots-Tag pose par le serveur Node vient par-dessus.
# =============================================================================
#
# ProxyPass        /api  http://127.0.0.1:8082/api
# ProxyPassReverse /api  http://127.0.0.1:8082/api
# ProxyPass        /     http://127.0.0.1:3001/
# ProxyPassReverse /     http://127.0.0.1:3001/
#
# RequestHeader set X-Forwarded-Proto "https"
# RequestHeader set X-Forwarded-Port  "443"
#
# Header always set X-Content-Type-Options "nosniff"
# Header always set X-Frame-Options "DENY"
# Header always set Referrer-Policy "strict-origin-when-cross-origin"
