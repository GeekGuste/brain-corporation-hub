<!-- Bandeau resserre, comme les deux autres pages. A hauteur pleine, il
     occupait plus d'un ecran avant que le premier paragraphe du corps
     n'apparaisse : trois lignes de titre, deux paragraphes de chapo en grand
     corps, puis les faits et le bouton empiles. -->
<app-page-contenu [contenu]="contenu" [bandeauCompact]="true">
  <!-- Le logo du programme, dans le bandeau de sa propre page. L en-tete du
       site porte celui de la plateforme : le visiteur voit les deux marques
       d un coup d oeil, et leur rapport se lit sans etre explique
       (CLAUDE.md §2). -->
  <app-logo-lignes-rouges logo-programme class="logo-programme" />
</app-page-contenu>


<!-- =========================================================================
     QUESTIONS FREQUENTES
     -------------------------------------------------------------------------
     Placees AVANT le formulaire : elles traitent les objections qui empechent
     de s inscrire, elles doivent donc se lire avant le moment de decider.

     En <details> natif : l accordeon fonctionne SANS JavaScript, il est
     navigable au clavier, et son contenu reste dans le HTML pour les moteurs
     de recherche. Le public est parfois en connexion lente (CLAUDE.md §13).
     ========================================================================= -->
<section class="faq" aria-labelledby="titre-faq">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">
        <h2 class="faq__titre" id="titre-faq">{{ faq.titre }}</h2>

        @for (item of faq.questions; track item.question) {
          <details class="faq__item">
            <summary class="faq__question">
              <h3 class="faq__intitule">{{ item.question }}</h3>
            </summary>
            <p class="faq__reponse">{{ item.reponse }}</p>
          </details>
        }
      </div>
    </div>
  </div>
</section>

<!-- =========================================================================
     INSCRIPTION
     -------------------------------------------------------------------------
     Ce bloc ne fait pas partie des textes du client : il est produit d'apres
     CLAUDE.md §4.

     Le prix est rappele ici, au point ou le visiteur decide, et non repete en
     tableau : les trois faits sont deja dans le bandeau de tete. La mention de
     TVA est obligatoire en auto-entreprise et doit figurer a cet endroit.

     Aucune date de session (CLAUDE.md §16), aucun compteur, aucune urgence
     fabriquee (§14).
     ========================================================================= -->
<section class="inscription" aria-labelledby="titre-inscription">
  <div class="container">
    <div class="row justify-content-center">
      <!-- Centre, et non cale a gauche : le panneau est le point d'arrivee de
           la page, pas une section de lecture. C'est aussi lui qui accueillera
           le formulaire et le paiement (etapes 4 et 5). -->
      <div class="col-12 col-lg-10 col-xl-8">
        <div id="inscription" class="inscription__panneau">
          <!-- Le logo du programme, une seconde fois, au moment de payer.
               Ce panneau est long : au bas d une page de lecture, puis
               derriere le formulaire et le cadre de Stripe, le bandeau de
               tete est hors de l ecran depuis longtemps. Le visiteur voit
               donc POUR QUOI il paie a l instant ou il paie, ce qui compte
               d autant plus que le libelle qui apparaitra sur son releve
               bancaire porte le nom de la formation.

               Plus petit que dans le bandeau : il situe, il n annonce pas.
               Decoratif, comme dans le bandeau : le titre juste en dessous
               porte deja le nom. -->
          <app-logo-lignes-rouges class="inscription__logo" />

          <h2 id="titre-inscription" class="inscription__titre">
            {{ inscription.titre }}
          </h2>

          <p class="inscription__recapitulatif">{{ inscription.recapitulatif }}</p>
          <p class="inscription__mention">{{ inscription.mentionTva }}</p>

          <!-- Formulaire d'inscription qualifie (etape 4). Le paiement Stripe
               s'integrera dans ce meme panneau a l'etape 5 : l'ancre
               #inscription ne changera pas. -->
          <app-formulaire-inscription />
        </div>
      </div>
    </div>
  </div>
</section>
