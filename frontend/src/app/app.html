<!-- Ossature du site. Aucun texte editorial ici : les libelles viennent de
     content/fr/navigation.json, les chemins de seo/routes.config.json.

     La navigation est une liste simple qui passe a la ligne sur petit ecran,
     sans menu deroulant. Trois liens seulement, et surtout : elle reste
     utilisable quand JavaScript est desactive, ce qui n'est pas le cas d'un
     menu replie Bootstrap. Aucun script Bootstrap n'est charge (CLAUDE.md §13,
     public souvent en connexion lente). -->

<a class="lien-evitement btn btn-primary" href="#contenu-principal">
  {{ navigation.lienEvitement }}
</a>

<header class="entete">
  <div class="container entete__barre">
    <!-- Emplacement du logo.
         La hauteur est reservee dans tous les cas, logo present ou non : la
         mise en page ne bougera pas le jour ou le fichier arrivera. Les
         dimensions et le texte alternatif sont parametrables dans
         navigation.json (CLAUDE.md §14). -->
    <a class="entete__marque" [routerLink]="liens[0].chemin">
      @if (logo.fichier) {
        <!-- Les attributs width et height portent les dimensions INTRINSEQUES
             du fichier. Ils reservent la place avant le chargement de l'image.
             En « attr. » plutot qu'en propriete, pour qu'ils disparaissent
             simplement s'ils ne sont pas renseignes.

             Le texte alternatif est VIDE a dessein : le nom de la marque est
             juste a cote, en vraies lettres. Le repeter ferait entendre deux
             fois la meme chose a un lecteur d'ecran. -->
        <img
          class="emplacement-logo"
          [src]="logo.fichier"
          [alt]="logo.texteAlternatif"
          [attr.width]="logo.largeur"
          [attr.height]="logo.hauteur"
        />
      }

      <!-- Le nom en vraies lettres, toujours. Le logo livre est carre : a la
           hauteur d'un en-tete, les mots qu'il contient sont illisibles. Ecrit
           a cote, le nom reste lisible a toute taille, il est lu par les
           lecteurs d'ecran, et il ne coute pas un octet de plus. -->
      <span class="entete__marque-texte">{{ navigation.marque }}</span>
    </a>

    <nav class="entete__navigation" aria-label="Navigation principale">
      <ul class="entete__liens">
        @for (lien of liens; track lien.cle) {
          <!-- Le lien que la marque dessert deja est masque sur telephone : les
               trois libelles n'y tiennent pas sur une ligne, et c'est le
               dernier, « Lignes Rouges », qui se faisait couper. Le logo reste
               cliquable et porte un nom accessible, la page n'est donc jamais
               hors d'atteinte. La condition porte sur le chemin de la marque,
               pas sur un rang : reordonner navigation.json reste sans effet
               sur le code. -->
          <li [class.entete__lien-redondant]="lien.chemin === liens[0].chemin">
            <a
              [routerLink]="lien.chemin"
              routerLinkActive="est-active"
              [routerLinkActiveOptions]="{ exact: lien.chemin === '/' }"
            >
              {{ lien.libelle }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
</header>

<main id="contenu-principal" tabindex="-1">
  <router-outlet />
</main>

<footer class="pied">
  <div class="container pied__contenu">
    <!-- Pages legales et referentiel territorial. Dans le pied et non dans la
         navigation de tete : ils doivent etre atteignables depuis toutes les
         pages, mais ils ne sont pas un chemin de lecture (CLAUDE.md §16).
         Les libelles viennent de navigation.json, les chemins de
         seo/routes.config.json. -->
    <nav class="pied__navigation" aria-label="Informations légales">
      <ul class="pied__liens">
        @for (lien of liensDuPied; track lien.cle) {
          <li>
            <a [routerLink]="lien.chemin">{{ lien.libelle }}</a>
          </li>
        }
      </ul>
    </nav>

    <p class="pied__mention">&copy; {{ anneeCourante }} {{ navigation.piedDePage.mention }}</p>
  </div>
</footer>

<!-- Mention d information sur les cookies. Apres le pied de page dans le
     document, collee en bas de la fenetre a l affichage : elle est le
     prolongement du pied, pas une alerte. Elle ne s affiche que dans le
     navigateur, voir le composant. -->
<app-mention-cookies />
