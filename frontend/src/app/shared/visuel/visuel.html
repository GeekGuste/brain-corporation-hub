<figure
  class="visuel"
  [class.visuel--blanc]="fond() === 'blanc'"
  [class.visuel--sur-encre]="fond() === 'encre'"
  [style.aspect-ratio]="rapport()"
>
  @if (fichier()) {
    <img
      class="visuel__image"
      [src]="fichier()"
      [alt]="texteAlternatif()"
      [attr.width]="largeur()"
      [attr.height]="hauteur()"
      [attr.loading]="premierEcran() ? 'eager' : 'lazy'"
      [attr.fetchpriority]="premierEcran() ? 'high' : null"
      decoding="async"
    />

    <!-- Legende, posee sur l'image et seulement si elle est renseignee.
         Elle existe pour un seul cas : dire « photographie d'illustration »
         la ou la photo pourrait passer pour un portrait reel. La section des
         formateurs montre un avocat, et les formateurs de la methode SONT des
         avocats : sans cette mention, le visiteur croirait voir celui qui
         l'animera, et nous n'inventons ni un nom ni un visage (CLAUDE.md §3). -->
    @if (legende()) {
      <figcaption class="visuel__legende">{{ legende() }}</figcaption>
    }
  } @else {
    <!-- Emplacement provisoire. L'illustration du site occupe la place, au
         rapport final, et l'etiquette rappelle qu'elle est a remplacer. -->
    <div class="visuel__motif">
      <app-motif [nom]="motif()" />
    </div>

    <figcaption class="visuel__etiquette">{{ etiquetteProvisoire() }}</figcaption>
  }
</figure>
