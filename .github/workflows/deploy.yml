# =============================================================================
# Construction des images et deploiement
# -----------------------------------------------------------------------------
#   develop -> preprod, automatique
#   main    -> production, apres approbation manuelle
#
# Les images sont taguees par SHA de commit. Le tag valide en preprod est
# ensuite promu en production sans reconstruction (CLAUDE.md §11).
#
# Secrets attendus dans le depot :
#   VPS_HOTE           adresse du serveur
#   VPS_UTILISATEUR    utilisateur de deploiement, « deploy »
#   VPS_CLE_SSH        cle privee correspondante
#   VPS_PORT_SSH       facultatif, 22 par defaut
#
# L'environnement GitHub « production » doit exiger votre approbation :
#   Parametres > Environments > production > Required reviewers
# =============================================================================

name: Deploiement

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  # Un deploiement a la fois par branche. Deux poussees rapprochees ne doivent
  # pas se marcher dessus sur le serveur.
  group: deploiement-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRE: ghcr.io
  # Le nom du compte proprietaire n'est ecrit nulle part en dur : il est deduit
  # du depot, et mis en minuscules a l'execution (voir le job « images »).
  # Le depot peut ainsi etre transfere a un autre compte sans modifier ce
  # fichier.
  NOM_IMAGE_API: brain-corporation-hub-api
  NOM_IMAGE_SSR: brain-corporation-hub-ssr

jobs:
  # ---------------------------------------------------------------------------
  # Controles avant toute construction
  # ---------------------------------------------------------------------------
  controles:
    name: Compilation et controles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependances du front
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Construction du front
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Construction du back
        run: dotnet build backend/BrainHub.slnx --configuration Release

  # ---------------------------------------------------------------------------
  # Construction et publication des images
  # ---------------------------------------------------------------------------
  images:
    name: Images Docker
    needs: controles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker exige des noms de depot entierement en minuscules, alors que
      # github.repository_owner restitue la casse exacte du compte
      # (« GeekGuste »). Les expressions GitHub Actions n'ont pas de fonction de
      # mise en minuscules, on la fait donc ici, en shell.
      #
      # C'est ce qui permet de transferer le depot vers un autre compte, celui
      # du client par exemple, sans toucher a ce fichier.
      - name: Deduire le prefixe des images
        id: prefixe
        env:
          PROPRIETAIRE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "valeur=${REGISTRE}/${PROPRIETAIRE,,}" >> "$GITHUB_OUTPUT"
          echo "Prefixe des images : ${REGISTRE}/${PROPRIETAIRE,,}"

      - name: Image de l'API
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # Tague par SHA, et par SHA seulement. Pas de « latest » : on doit
          # toujours savoir quel commit tourne, et pouvoir revenir en arriere.
          tags: ${{ steps.prefixe.outputs.valeur }}/${{ env.NOM_IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image du serveur de rendu
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.prefixe.outputs.valeur }}/${{ env.NOM_IMAGE_SSR }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Purge des anciennes versions d'images
  # ---------------------------------------------------------------------------
  # On tague par SHA de commit : sans purge, chaque commit ajoute une version et
  # le stockage du registre croit indefiniment, jusqu'a depasser le quota des
  # paquets prives.
  #
  # Dix versions conservees : de quoi revenir en arriere sur dix deploiements,
  # ce qui couvre tres largement le besoin reel. Le stockage se stabilise alors
  # autour de 300 a 400 Mo au lieu de grossir sans fin.
  #
  # La purge tourne apres la publication et n'echoue jamais le workflow : un
  # probleme de menage ne doit pas empecher un deploiement.
  purge:
    name: Purge des anciennes images
    needs: images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    continue-on-error: true
    steps:
      # Une etape par image, avec « package-name » au singulier : c'est l'entree
      # que l'action garantit. Le nom du proprietaire n'apparait pas, l'action
      # travaille sur les paquets du depot courant.
      - name: Purge des images de l'API
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.NOM_IMAGE_API }}
          package-type: container
          min-versions-to-keep: 10

      - name: Purge des images du serveur de rendu
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.NOM_IMAGE_SSR }}
          package-type: container
          min-versions-to-keep: 10

  # ---------------------------------------------------------------------------
  # Preprod : automatique
  # ---------------------------------------------------------------------------
  preprod:
    name: Deploiement preprod
    if: github.ref == 'refs/heads/develop'
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: preprod
      url: https://dev.braincorporationhub.com
    steps:
      - uses: actions/checkout@v4
      - name: Deployer
        uses: ./.github/actions/deployer
        with:
          environnement: preprod
          tag: ${{ github.sha }}
          hote: ${{ secrets.VPS_HOTE }}
          utilisateur: ${{ secrets.VPS_UTILISATEUR }}
          cle-ssh: ${{ secrets.VPS_CLE_SSH }}
          port-ssh: ${{ secrets.VPS_PORT_SSH }}

  # ---------------------------------------------------------------------------
  # Production : sous approbation
  # ---------------------------------------------------------------------------
  # L'image est deja construite a ce stade. Le job attend votre validation dans
  # l'onglet Actions avant de toucher au serveur.
  production:
    name: Deploiement production
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://braincorporationhub.com
    steps:
      - uses: actions/checkout@v4
      - name: Deployer
        uses: ./.github/actions/deployer
        with:
          environnement: prod
          tag: ${{ github.sha }}
          hote: ${{ secrets.VPS_HOTE }}
          utilisateur: ${{ secrets.VPS_UTILISATEUR }}
          cle-ssh: ${{ secrets.VPS_CLE_SSH }}
          port-ssh: ${{ secrets.VPS_PORT_SSH }}
